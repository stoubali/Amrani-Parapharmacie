<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Amrani Parapharmacie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <!-- ========== LOGIN CONTAINER ========== -->
    <div class="login-wrapper">
        <div class="login-container">
            <!-- Logo & Brand -->
            <div class="login-header">
                <div class="login-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 8a4 4 0 0 1 4 4 4 4 0 0 1-4 4 4 4 0 0 1-4-4 4 4 0 0 1 4-4z"/>
                        <path d="M12 2v2"/>
                        <path d="M12 20v2"/>
                        <path d="M4 12H2"/>
                        <path d="M22 12h-2"/>
                        <path d="M19.1 4.9l-1.4 1.4"/>
                        <path d="M6.3 17.7l-1.4 1.4"/>
                        <path d="M17.7 6.3l1.4-1.4"/>
                        <path d="M6.3 6.3l-1.4-1.4"/>
                    </svg>
                </div>
                <h1 class="login-brand">Amrani Parapharmacie</h1>
                <p class="login-welcome">Bienvenue dans l'espace administration</p>
            </div>

            <!-- Login Card -->
            <div class="login-card">
                <h2 class="login-title">Connexion</h2>
                <p class="login-subtitle">Accédez à votre tableau de bord</p>

                <form id="loginForm" novalidate>
                    <!-- Email -->
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                            <input type="email" id="loginEmail" placeholder="admin@amrani.ma" required>
                        </div>
                        <span class="error-msg" id="emailError"></span>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="loginPassword">Mot de passe</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input type="password" id="loginPassword" placeholder="••••••••" required>
                            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Afficher/Masquer le mot de passe">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <span class="error-msg" id="passwordError"></span>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="login-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkmark"></span>
                            Se souvenir de moi
                        </label>
                        <a href="#" class="forgot-link">Mot de passe oublié ?</a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn btn-primary login-btn" id="loginBtn">
                        <span id="loginBtnText">Se connecter</span>
                        <span id="loginBtnLoader" class="loader" style="display: none;"></span>
                    </button>

                    <!-- Error Message -->
                    <div id="loginError" class="login-error" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        <span id="loginErrorMessage">Identifiants invalides</span>
                    </div>
                </form>

                <!-- Back to site -->
                <div class="login-footer">
                    <a href="index.html" class="back-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"/>
                        </svg>
                        Retour au site
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>

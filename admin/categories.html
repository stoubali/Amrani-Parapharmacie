<!-- ==================== MODALS ==================== -->

<!-- Add/Edit Category Modal -->
<div class="modal-overlay" id="categoryModal">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modalTitle">Add Category</h2>
            <button class="modal-close" id="closeModal">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="categoryForm" novalidate>
                <input type="hidden" id="categoryId" value="" />
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nameFr">French Name <span class="required">*</span></label>
                        <input type="text" id="nameFr" placeholder="e.g., Médicaments" required />
                    </div>
                    <div class="form-group">
                        <label for="nameAr">Arabic Name <span class="required">*</span></label>
                        <input type="text" id="nameAr" placeholder="e.g., أدوية" required dir="rtl" />
                    </div>
                    <div class="form-group full-width">
                        <label for="imageUrl">Image URL</label>
                        <input type="url" id="imageUrl" placeholder="https://example.com/category-image.jpg" />
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveCategoryBtn">
                        <i class="fas fa-save"></i> <span id="saveBtnText">Save Category</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal modal-delete">
        <div class="modal-header">
            <h2>Confirm Delete</h2>
            <button class="modal-close" id="closeDeleteModal">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="delete-confirm">
                <i class="fas fa-exclamation-triangle"></i>
                <p>Are you sure you want to delete category <strong id="deleteCategoryName"></strong>?</p>
                <p class="delete-warning">This action cannot be undone. Products in this category will be uncategorized.</p>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-outline" id="cancelDeleteBtn">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
                    <i class="fas fa-trash"></i> Delete Category
                </button>
            </div>
        </div>
    </div>
</div>
